<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça-Palavras Neon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 2.3rem;
            color: #ffffff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 80px #0ff;
            letter-spacing: 2px;
        }

        .info {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: #e0e0e0;
            text-shadow: 0 0 8px #0ff;
        }

        .jogador-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .jogador-box label {
            font-size: 1rem;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            font-weight: bold;
        }

        #nomeJogador {
            background: #0a0a0a;
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 10px 16px;
            color: #fff;
            font-size: 1.1rem;
            width: 220px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.25s;
        }

        #nomeJogador:focus {
            box-shadow: 0 0 15px #0ff, 0 0 25px #0ff;
            border-color: #fff;
        }

        #nomeJogador::placeholder {
            color: #555;
        }

        .timer-box {
            background: #0a0a0a;
            border: 2px solid #0ff;
            border-radius: 12px;
            padding: 10px 24px;
            margin-bottom: 18px;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
            text-align: center;
        }

        .timer-label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
        }

        #timer {
            font-size: 2rem;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            letter-spacing: 3px;
            font-variant-numeric: tabular-nums;
        }

        .opcoes {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .grupo {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .grupo-titulo {
            width: 100%;
            text-align: center;
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 4px;
            text-shadow: 0 0 6px #0ff;
        }

        .categoria-btn, .nivel-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #ff00aa;
            padding: 10px 16px;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 0 8px #ff00aa;
            box-shadow: 0 0 10px rgba(255, 0, 170, 0.4);
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        .categoria-btn:hover, .nivel-btn:hover {
            background: #ff00aa;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 15px #ff00aa, 0 0 30px #ff00aa;
            transform: translateY(-2px);
        }

        .categoria-btn.ativo, .nivel-btn.ativo {
            background: #0ff;
            color: #000;
            border-color: #0ff;
            text-shadow: none;
            box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1300px;
        }

        #grid {
            display: grid;
            gap: 2px;
            background: #0a0a0a;
            padding: 8px;
            border-radius: 14px;
            border: 2px solid #0ff;
            box-shadow: 
                0 0 10px #0ff,
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 15px rgba(0, 255, 255, 0.1);
            user-select: none;
        }

        .cell {
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #222;
            transition: all 0.15s ease;
            text-shadow: 0 0 6px #fff;
        }

        .cell:hover {
            background: #1a1a1a;
            border-color: #0ff;
            box-shadow: 0 0 8px #0ff;
            transform: scale(1.05);
        }

        .cell.selected {
            background: #0ff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            text-shadow: none;
            transform: scale(1.08);
        }

        .cell.found {
            background: #00ff9d;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px #00ff9d, 0 0 20px #00ff9d;
            text-shadow: none;
        }

        .words-panel {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 14px;
            min-width: 220px;
            border: 2px solid #ff00aa;
            box-shadow: 0 0 10px #ff00aa, 0 0 20px rgba(255, 0, 170, 0.3);
        }

        .words-panel h2 {
            margin-bottom: 14px;
            font-size: 1.3rem;
            color: #fff;
            border-bottom: 2px solid #ff00aa;
            padding-bottom: 8px;
            text-shadow: 0 0 5px #fff, 0 0 15px #ff00aa;
        }

        #word-list {
            list-style: none;
        }

        #word-list li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #111;
            border-radius: 7px;
            font-size: 1.05rem;
            color: #fff;
            border: 1px solid #333;
            transition: all 0.3s;
            text-shadow: 0 0 6px #fff;
        }

        #word-list li.found {
            background: #00ff9d;
            color: #000;
            text-decoration: line-through;
            border-color: #fff;
            box-shadow: 0 0 10px #00ff9d;
            text-shadow: none;
            opacity: 0.9;
        }

        .ranking-panel {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 14px;
            min-width: 280px;
            border: 2px solid #ff00aa;
            box-shadow: 0 0 10px #ff00aa, 0 0 20px rgba(255, 0, 170, 0.3);
            margin-top: 20px;
        }

        .ranking-panel h2 {
            margin-bottom: 14px;
            font-size: 1.3rem;
            color: #fff;
            border-bottom: 2px solid #ff00aa;
            padding-bottom: 8px;
            text-shadow: 0 0 5px #fff, 0 0 15px #ff00aa;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th {
            background: #111;
            color: #0ff;
            padding: 10px 8px;
            text-align: left;
            border-bottom: 2px solid #0ff;
            text-shadow: 0 0 6px #0ff;
        }

        td {
            padding: 9px 8px;
            border-bottom: 1px solid #222;
            color: #eee;
        }

        tr:nth-child(even) td {
            background: #0d0d0d;
        }

        tr:hover td {
            background: #1a1a1a;
        }

        .posicao {
            font-weight: bold;
            color: #0ff;
            width: 40px;
        }

        .ouro { color: #ffd700; text-shadow: 0 0 8px #ffd700; }
        .prata { color: #c0c0c0; text-shadow: 0 0 8px #c0c0c0; }
        .bronze { color: #cd7f32; text-shadow: 0 0 8px #cd7f32; }

        .controls {
            margin-top: 28px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid #0ff;
            padding: 12px 26px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 0 8px #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        button:hover {
            background: #0ff;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
            transform: translateY(-3px);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 22px;
            font-size: 1.35rem;
            font-weight: bold;
            color: #00ff9d;
            text-shadow: 0 0 5px #00ff9d, 0 0 15px #00ff9d, 0 0 30px #00ff9d;
            min-height: 32px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.ativo {
            display: flex;
        }

        .modal {
            background: #0a0a0a;
            border: 2px solid #ff00aa;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 0 20px #ff00aa, 0 0 40px rgba(255, 0, 170, 0.4);
            max-width: 420px;
            width: 90%;
            animation: aparecer 0.3s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h2 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: #fff;
            text-shadow: 0 0 10px #ff00aa, 0 0 20px #ff00aa;
        }

        .modal p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .modal-botoes {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-confirmar {
            background: transparent;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 0 8px #ff4d6d;
            box-shadow: 0 0 10px rgba(255, 77, 109, 0.4);
            transition: all 0.25s ease;
        }

        .btn-confirmar:hover {
            background: #ff4d6d;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 15px #ff4d6d, 0 0 30px #ff4d6d;
        }

        .btn-cancelar {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 0 8px #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            transition: all 0.25s ease;
        }

        .btn-cancelar:hover {
            background: #0ff;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
        }
    </style>
</head>
<body>
    <h1>🔍 CAÇA-PALAVRAS</h1>
    <div class="info">Digite o nome do jogador e escolha a categoria/nível</div>

    <div class="jogador-box">
        <label for="nomeJogador">JOGADOR:</label>
        <input type="text" id="nomeJogador" placeholder="Digite seu nome..." maxlength="20" autocomplete="off">
    </div>

    <div class="timer-box">
        <div class="timer-label">TEMPO</div>
        <div id="timer">00:00</div>
    </div>

    <div class="opcoes">
        <div class="grupo">
            <div class="grupo-titulo">CATEGORIA</div>
            <button class="categoria-btn ativo" onclick="escolherCategoria('animais')">🐾 ANIMAIS</button>
            <button class="categoria-btn" onclick="escolherCategoria('objetos')">📦 OBJETOS</button>
            <button class="categoria-btn" onclick="escolherCategoria('pessoas')">👤 PESSOAS</button>
            <button class="categoria-btn" onclick="escolherCategoria('carros')">🚗 CARROS</button>
        </div>

        <div class="grupo">
            <div class="grupo-titulo">NÍVEL</div>
            <button class="nivel-btn" onclick="escolherNivel('facil')">FÁCIL</button>
            <button class="nivel-btn ativo" onclick="escolherNivel('medio')">MÉDIO</button>
            <button class="nivel-btn" onclick="escolherNivel('dificil')">DIFÍCIL</button>
            <button class="nivel-btn" onclick="escolherNivel('hard')">HARD</button>
        </div>
    </div>

    <div class="container">
        <div id="grid"></div>

        <div class="words-panel">
            <h2>PALAVRAS</h2>
            <ul id="word-list"></ul>
        </div>
    </div>

    <div class="ranking-panel">
        <h2>🏆 RANKING</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>JOGADOR</th>
                    <th>TEMPO</th>
                    <th>NÍVEL</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="controls">
        <button onclick="novoJogo()">NOVO JOGO</button>
        <button onclick="mostrarSolucao()">MOSTRAR SOLUÇÃO</button>
        <button onclick="abrirModalLimpar()">LIMPAR RANKING</button>
    </div>

    <div class="message" id="message"></div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalLimpar">
        <div class="modal">
            <h2>⚠️ LIMPAR RANKING</h2>
            <p>Tem certeza que deseja apagar<br>todo o ranking?<br><br>
            <strong style="color:#ff4d6d;">Esta ação não pode ser desfeita!</strong></p>
            <div class="modal-botoes">
                <button class="btn-confirmar" onclick="confirmarLimparRanking()">SIM, APAGAR</button>
                <button class="btn-cancelar" onclick="fecharModal()">CANCELAR</button>
            </div>
        </div>
    </div>

    <script>
        const categorias = {
            animais: [
                "GATO", "CACHORRO", "PASSARO", "PEIXE", "COELHO",
                "LEAO", "TIGRE", "URSO", "RAPOSA", "CORUJA",
                "CAVALO", "ELEFANTE", "GIRAFA", "MACACO", "LOBO"
            ],
            objetos: [
                "MESA", "CADEIRA", "LIVRO", "CANETA", "RELOGIO",
                "CELULAR", "CHAVE", "OCULOS", "MOCHILA", "LAMPADA",
                "COMPUTADOR", "TELEVISAO", "FOGAO", "GELADERIA", "VENTILADOR"
            ],
            pessoas: [
                "ANA", "JOAO", "MARIA", "PEDRO", "LUCAS",
                "JULIA", "CARLOS", "SOFIA", "MIGUEL", "BEATRIZ",
                "GABRIEL", "LARISSA", "RAFAEL", "FERNANDA", "THIAGO"
            ],
            carros: [
                "FUSCA", "GOL", "CIVIC", "COROLLA", "MUSTANG",
                "CAMARO", "FERRARI", "PORSCHE", "TESLA", "ONIX",
                "HB20", "CRETA", "COMPASS", "TRACKER", "KICKS"
            ]
        };

        const niveis = {
            facil:  { tamanho: 10, qtdPalavras: 6,  tamanhoCelula: 40 },
            medio:  { tamanho: 12, qtdPalavras: 8,  tamanhoCelula: 34 },
            dificil:{ tamanho: 14, qtdPalavras: 10, tamanhoCelula: 30 },
            hard:   { tamanho: 16, qtdPalavras: 12, tamanhoCelula: 26 }
        };

        let palavrasCompletas = [...categorias.animais];
        let palavras = [];
        let categoriaAtual = 'animais';
        let nivelAtual = 'medio';
        let tamanho = 12;
        let grade = [];
        let palavrasEncontradas = new Set();
        let selecionando = false;
        let caminhoSelecionado = [];
        let direcaoAtual = null;

        let segundos = 0;
        let timerInterval = null;
        let jogoFinalizado = false;

        function formatarTempo(seg) {
            const min = Math.floor(seg / 60);
            const s = seg % 60;
            return String(min).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function iniciarTimer() {
            pararTimer();
            segundos = 0;
            jogoFinalizado = false;
            document.getElementById('timer').textContent = '00:00';
            timerInterval = setInterval(() => {
                if (!jogoFinalizado) {
                    segundos++;
                    document.getElementById('timer').textContent = formatarTempo(segundos);
                }
            }, 1000);
        }

        function pararTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function pegarNomeJogador() {
            const nome = document.getElementById('nomeJogador').value.trim();
            return nome !== '' ? nome.toUpperCase() : 'JOGADOR';
        }

        function carregarRanking() {
            const dados = localStorage.getItem('cacaPalavrasRanking');
            return dados ? JSON.parse(dados) : [];
        }

        function salvarRanking(lista) {
            localStorage.setItem('cacaPalavrasRanking', JSON.stringify(lista));
        }

        function adicionarAoRanking(nome, tempoSegundos, nivel) {
            const ranking = carregarRanking();
            ranking.push({
                nome: nome,
                tempo: tempoSegundos,
                nivel: nivel.toUpperCase(),
                data: new Date().toLocaleDateString('pt-BR')
            });
            ranking.sort((a, b) => a.tempo - b.tempo);
            if (ranking.length > 10) ranking.length = 10;
            salvarRanking(ranking);
            renderizarRanking();
        }

        function renderizarRanking() {
            const ranking = carregarRanking();
            const tbody = document.getElementById('ranking-body');
            tbody.innerHTML = '';

            if (ranking.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#666;">Nenhum recorde ainda</td></tr>`;
                return;
            }

            ranking.forEach((item, index) => {
                const tr = document.createElement('tr');
                let classePos = '';
                if (index === 0) classePos = 'ouro';
                else if (index === 1) classePos = 'prata';
                else if (index === 2) classePos = 'bronze';

                tr.innerHTML = `
                    <td class="posicao ${classePos}">${index + 1}º</td>
                    <td>${item.nome}</td>
                    <td>${formatarTempo(item.tempo)}</td>
                    <td>${item.nivel}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function abrirModalLimpar() {
            document.getElementById('modalLimpar').classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('modalLimpar').classList.remove('ativo');
        }

        function confirmarLimparRanking() {
            localStorage.removeItem('cacaPalavrasRanking');
            renderizarRanking();
            fecharModal();
            document.getElementById('message').textContent = '🗑️ Ranking apagado com sucesso!';
            setTimeout(() => {
                document.getElementById('message').textContent = '';
            }, 3000);
        }

        document.getElementById('modalLimpar').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });

        const direcoes = [
            {dx: 0, dy: 1}, {dx: 1, dy: 0}, {dx: 1, dy: 1}, {dx: 1, dy: -1},
            {dx: 0, dy: -1}, {dx: -1, dy: 0}, {dx: -1, dy: 1}, {dx: -1, dy: -1}
        ];

        function escolherCategoria(cat) {
            categoriaAtual = cat;
            palavrasCompletas = [...categorias[cat]];
            document.querySelectorAll('.categoria-btn').forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');
            novoJogo();
        }

        function escolherNivel(nivel) {
            nivelAtual = nivel;
            tamanho = niveis[nivel].tamanho;
            document.querySelectorAll('.nivel-btn').forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');
            novoJogo();
        }

        function criarGradeVazia() {
            return Array.from({length: tamanho}, () => Array(tamanho).fill(''));
        }

        function podeColocar(palavra, linha, col, dir) {
            for (let i = 0; i < palavra.length; i++) {
                const r = linha + dir.dx * i;
                const c = col + dir.dy * i;
                if (r < 0 || r >= tamanho || c < 0 || c >= tamanho) return false;
                if (grade[r][c] !== '' && grade[r][c] !== palavra[i]) return false;
            }
            return true;
        }

        function colocarPalavra(palavra) {
            for (let t = 0; t < 200; t++) {
                const dir = direcoes[Math.floor(Math.random() * direcoes.length)];
                const linha = Math.floor(Math.random() * tamanho);
                const col = Math.floor(Math.random() * tamanho);
                if (podeColocar(palavra, linha, col, dir)) {
                    for (let i = 0; i < palavra.length; i++) {
                        grade[linha + dir.dx * i][col + dir.dy * i] = palavra[i];
                    }
                    return true;
                }
            }
            return false;
        }

        function preencherLetrasAleatorias() {
            const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let i = 0; i < tamanho; i++) {
                for (let j = 0; j < tamanho; j++) {
                    if (grade[i][j] === '') {
                        grade[i][j] = letras[Math.floor(Math.random() * letras.length)];
                    }
                }
            }
        }

        function gerarGrade() {
            const config = niveis[nivelAtual];
            const embaralhadas = [...palavrasCompletas].sort(() => Math.random() - 0.5);
            palavras = embaralhadas.slice(0, config.qtdPalavras);

            grade = criarGradeVazia();
            palavras.forEach(p => colocarPalavra(p));
            preencherLetrasAleatorias();
        }

        function renderizarGrade() {
            const gridEl = document.getElementById('grid');
            const celula = niveis[nivelAtual].tamanhoCelula;

            gridEl.style.gridTemplateColumns = `repeat(${tamanho}, ${celula}px)`;
            gridEl.style.gridTemplateRows = `repeat(${tamanho}, ${celula}px)`;
            gridEl.innerHTML = '';

            for (let i = 0; i < tamanho; i++) {
                for (let j = 0; j < tamanho; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = celula + 'px';
                    cell.style.height = celula + 'px';
                    cell.style.fontSize = (celula * 0.55) + 'px';
                    cell.textContent = grade[i][j];
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.addEventListener('mousedown', iniciarSelecao);
                    cell.addEventListener('mouseenter', continuarSelecao);
                    cell.addEventListener('mouseup', finalizarSelecao);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderizarListaPalavras() {
            const lista = document.getElementById('word-list');
            lista.innerHTML = '';
            palavras.forEach(p => {
                const li = document.createElement('li');
                li.textContent = p;
                li.id = 'palavra-' + p;
                if (palavrasEncontradas.has(p)) li.classList.add('found');
                lista.appendChild(li);
            });
        }

        function iniciarSelecao(e) {
            if (jogoFinalizado) return;
            selecionando = true;
            caminhoSelecionado = [];
            direcaoAtual = null;
            adicionarAoCaminho(e.target);
            e.preventDefault();
        }

        function continuarSelecao(e) {
            if (!selecionando || jogoFinalizado) return;
            const cell = e.target;
            if (!cell.classList.contains('cell')) return;

            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            if (caminhoSelecionado.length === 0) {
                adicionarAoCaminho(cell);
                return;
            }

            const ultimo = caminhoSelecionado[caminhoSelecionado.length - 1];
            const lastRow = parseInt(ultimo.dataset.row);
            const lastCol = parseInt(ultimo.dataset.col);

            if (caminhoSelecionado.some(c => c.dataset.row == row && c.dataset.col == col)) {
                if (caminhoSelecionado.length > 1) {
                    const penultimo = caminhoSelecionado[caminhoSelecionado.length - 2];
                    if (penultimo.dataset.row == row && penultimo.dataset.col == col) {
                        caminhoSelecionado.pop().classList.remove('selected');
                    }
                }
                return;
            }

            if (caminhoSelecionado.length === 1) {
                const dx = row - lastRow;
                const dy = col - lastCol;
                if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1 && (dx !== 0 || dy !== 0)) {
                    direcaoAtual = {dx, dy};
                    adicionarAoCaminho(cell);
                }
                return;
            }

            if (direcaoAtual) {
                const esperadoRow = lastRow + direcaoAtual.dx;
                const esperadoCol = lastCol + direcaoAtual.dy;
                if (row === esperadoRow && col === esperadoCol) {
                    adicionarAoCaminho(cell);
                }
            }
        }

        function adicionarAoCaminho(cell) {
            if (!caminhoSelecionado.includes(cell)) {
                caminhoSelecionado.push(cell);
                cell.classList.add('selected');
            }
        }

        function finalizarSelecao() {
            if (!selecionando || jogoFinalizado) return;
            selecionando = false;

            const palavra = caminhoSelecionado.map(c => c.textContent).join('');
            const palavraInvertida = palavra.split('').reverse().join('');

            let encontrada = null;
            if (palavras.includes(palavra) && !palavrasEncontradas.has(palavra)) {
                encontrada = palavra;
            } else if (palavras.includes(palavraInvertida) && !palavrasEncontradas.has(palavraInvertida)) {
                encontrada = palavraInvertida;
            }

            if (encontrada) {
                palavrasEncontradas.add(encontrada);
                caminhoSelecionado.forEach(c => {
                    c.classList.remove('selected');
                    c.classList.add('found');
                });
                document.getElementById('palavra-' + encontrada).classList.add('found');
                verificarVitoria();
            } else {
                caminhoSelecionado.forEach(c => c.classList.remove('selected'));
            }

            caminhoSelecionado = [];
            direcaoAtual = null;
        }

        function verificarVitoria() {
            if (palavrasEncontradas.size === palavras.length) {
                jogoFinalizado = true;
                pararTimer();
                const tempoFinal = formatarTempo(segundos);
                const nome = pegarNomeJogador();
                document.getElementById('message').textContent = 
                    `🎉 PARABÉNS, ${nome}! Você terminou em ${tempoFinal}!`;
                adicionarAoRanking(nome, segundos, nivelAtual);
            }
        }

        function novoJogo() {
            palavrasEncontradas.clear();
            document.getElementById('message').textContent = '';
            gerarGrade();
            renderizarGrade();
            renderizarListaPalavras();
            iniciarTimer();
        }

        function mostrarSolucao() {
            if (jogoFinalizado) return;
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));

            palavras.forEach(palavra => {
                if (!palavrasEncontradas.has(palavra)) {
                    for (let i = 0; i < tamanho; i++) {
                        for (let j = 0; j < tamanho; j++) {
                            for (const dir of direcoes) {
                                if (podeColocarNaGradeAtual(palavra, i, j, dir)) {
                                    for (let k = 0; k < palavra.length; k++) {
                                        const r = i + dir.dx * k;
                                        const c = j + dir.dy * k;
                                        const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                                        if (cell) cell.classList.add('found');
                                    }
                                    palavrasEncontradas.add(palavra);
                                    document.getElementById('palavra-' + palavra).classList.add('found');
                                    return;
                                }
                            }
                        }
                    }
                }
            });
            verificarVitoria();
        }

        function podeColocarNaGradeAtual(palavra, linha, col, dir) {
            for (let i = 0; i < palavra.length; i++) {
                const r = linha + dir.dx * i;
                const c = col + dir.dy * i;
                if (r < 0 || r >= tamanho || c < 0 || c >= tamanho) return false;
                if (grade[r][c] !== palavra[i]) return false;
            }
            return true;
        }

        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('mouseup', finalizarSelecao);

        renderizarRanking();
        novoJogo();
    </script>
</body>
</html>
