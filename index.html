<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça-Palavras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-shadow: 0 0 10px #0f3460;
        }

        .info {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1000px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 2px;
            background: #0f3460;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            user-select: none;
        }

        .cell {
            width: 40px;
            height: 40px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s, transform 0.1s;
        }

        .cell:hover {
            background: #533483;
        }

        .cell.selected {
            background: #e94560;
            transform: scale(1.05);
        }

        .cell.found {
            background: #00b894;
            color: #fff;
        }

        .words-panel {
            background: #0f3460;
            padding: 20px;
            border-radius: 12px;
            min-width: 220px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .words-panel h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #e94560;
            padding-bottom: 8px;
        }

        #word-list {
            list-style: none;
        }

        #word-list li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #1a1a2e;
            border-radius: 6px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        #word-list li.found {
            background: #00b894;
            text-decoration: line-through;
            opacity: 0.8;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #00b894;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <h1>🔍 Caça-Palavras</h1>
    <div class="info">Encontre todas as palavras na grade!</div>

    <div class="container">
        <div id="grid"></div>

        <div class="words-panel">
            <h2>Palavras</h2>
            <ul id="word-list"></ul>
        </div>
    </div>

    <div class="controls">
        <button onclick="novoJogo()">Novo Jogo</button>
        <button onclick="mostrarSolucao()">Mostrar Solução</button>
    </div>

    <div class="message" id="message"></div>

    <script>
        const tamanho = 10;
        const palavras = [
            "GATO", "CACHORRO", "PASSARO", "PEIXE", "COELHO",
            "LEAO", "TIGRE", "URSO", "RAPOSA", "CORUJA"
        ];

        let grade = [];
        let palavrasEncontradas = new Set();
        let selecionando = false;
        let caminhoSelecionado = [];
        let direcaoAtual = null;

        // Direções possíveis (horizontal, vertical, diagonal)
        const direcoes = [
            {dx: 0, dy: 1},   // direita
            {dx: 1, dy: 0},   // baixo
            {dx: 1, dy: 1},   // diagonal baixo-direita
            {dx: 1, dy: -1},  // diagonal baixo-esquerda
            {dx: 0, dy: -1},  // esquerda
            {dx: -1, dy: 0},  // cima
            {dx: -1, dy: 1},  // diagonal cima-direita
            {dx: -1, dy: -1}  // diagonal cima-esquerda
        ];

        function criarGradeVazia() {
            return Array.from({length: tamanho}, () => Array(tamanho).fill(''));
        }

        function podeColocar(palavra, linha, col, dir) {
            for (let i = 0; i < palavra.length; i++) {
                const r = linha + dir.dx * i;
                const c = col + dir.dy * i;
                if (r < 0 || r >= tamanho || c < 0 || c >= tamanho) return false;
                if (grade[r][c] !== '' && grade[r][c] !== palavra[i]) return false;
            }
            return true;
        }

        function colocarPalavra(palavra) {
            const tentativas = 100;
            for (let t = 0; t < tentativas; t++) {
                const dir = direcoes[Math.floor(Math.random() * direcoes.length)];
                const linha = Math.floor(Math.random() * tamanho);
                const col = Math.floor(Math.random() * tamanho);
                if (podeColocar(palavra, linha, col, dir)) {
                    for (let i = 0; i < palavra.length; i++) {
                        grade[linha + dir.dx * i][col + dir.dy * i] = palavra[i];
                    }
                    return true;
                }
            }
            return false;
        }

        function preencherLetrasAleatorias() {
            const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let i = 0; i < tamanho; i++) {
                for (let j = 0; j < tamanho; j++) {
                    if (grade[i][j] === '') {
                        grade[i][j] = letras[Math.floor(Math.random() * letras.length)];
                    }
                }
            }
        }

        function gerarGrade() {
            grade = criarGradeVazia();
            // Embaralha as palavras para variar a posição
            const palavrasEmbaralhadas = [...palavras].sort(() => Math.random() - 0.5);
            palavrasEmbaralhadas.forEach(p => colocarPalavra(p));
            preencherLetrasAleatorias();
        }

        function renderizarGrade() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let i = 0; i < tamanho; i++) {
                for (let j = 0; j < tamanho; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = grade[i][j];
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.addEventListener('mousedown', iniciarSelecao);
                    cell.addEventListener('mouseenter', continuarSelecao);
                    cell.addEventListener('mouseup', finalizarSelecao);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderizarListaPalavras() {
            const lista = document.getElementById('word-list');
            lista.innerHTML = '';
            palavras.forEach(p => {
                const li = document.createElement('li');
                li.textContent = p;
                li.id = 'palavra-' + p;
                if (palavrasEncontradas.has(p)) {
                    li.classList.add('found');
                }
                lista.appendChild(li);
            });
        }

        function iniciarSelecao(e) {
            selecionando = true;
            caminhoSelecionado = [];
            direcaoAtual = null;
            const cell = e.target;
            adicionarAoCaminho(cell);
            e.preventDefault();
        }

        function continuarSelecao(e) {
            if (!selecionando) return;
            const cell = e.target;
            if (!cell.classList.contains('cell')) return;

            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            if (caminhoSelecionado.length === 0) {
                adicionarAoCaminho(cell);
                return;
            }

            const ultimo = caminhoSelecionado[caminhoSelecionado.length - 1];
            const lastRow = parseInt(ultimo.dataset.row);
            const lastCol = parseInt(ultimo.dataset.col);

            // Verifica se já está no caminho
            if (caminhoSelecionado.some(c => c.dataset.row == row && c.dataset.col == col)) {
                // Se voltou para o penúltimo, remove o último
                if (caminhoSelecionado.length > 1) {
                    const penultimo = caminhoSelecionado[caminhoSelecionado.length - 2];
                    if (penultimo.dataset.row == row && penultimo.dataset.col == col) {
                        caminhoSelecionado.pop().classList.remove('selected');
                    }
                }
                return;
            }

            // Define a direção no segundo clique
            if (caminhoSelecionado.length === 1) {
                const dx = row - lastRow;
                const dy = col - lastCol;
                if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1 && (dx !== 0 || dy !== 0)) {
                    direcaoAtual = {dx, dy};
                    adicionarAoCaminho(cell);
                }
                return;
            }

            // Continua na mesma direção
            if (direcaoAtual) {
                const esperadoRow = lastRow + direcaoAtual.dx;
                const esperadoCol = lastCol + direcaoAtual.dy;
                if (row === esperadoRow && col === esperadoCol) {
                    adicionarAoCaminho(cell);
                }
            }
        }

        function adicionarAoCaminho(cell) {
            if (!caminhoSelecionado.includes(cell)) {
                caminhoSelecionado.push(cell);
                cell.classList.add('selected');
            }
        }

        function finalizarSelecao() {
            if (!selecionando) return;
            selecionando = false;

            const palavra = caminhoSelecionado.map(c => c.textContent).join('');
            const palavraInvertida = palavra.split('').reverse().join('');

            let encontrada = null;
            if (palavras.includes(palavra) && !palavrasEncontradas.has(palavra)) {
                encontrada = palavra;
            } else if (palavras.includes(palavraInvertida) && !palavrasEncontradas.has(palavraInvertida)) {
                encontrada = palavraInvertida;
            }

            if (encontrada) {
                palavrasEncontradas.add(encontrada);
                caminhoSelecionado.forEach(c => {
                    c.classList.remove('selected');
                    c.classList.add('found');
                });
                document.getElementById('palavra-' + encontrada).classList.add('found');
                verificarVitoria();
            } else {
                // Limpa seleção
                caminhoSelecionado.forEach(c => c.classList.remove('selected'));
            }

            caminhoSelecionado = [];
            direcaoAtual = null;
        }

        function verificarVitoria() {
            if (palavrasEncontradas.size === palavras.length) {
                document.getElementById('message').textContent = '🎉 Parabéns! Você encontrou todas as palavras!';
            }
        }

        function novoJogo() {
            palavrasEncontradas.clear();
            document.getElementById('message').textContent = '';
            gerarGrade();
            renderizarGrade();
            renderizarListaPalavras();
        }

        function mostrarSolucao() {
            // Marca todas as palavras restantes
            const cells = document.querySelectorAll('.cell');
            cells.forEach(c => c.classList.remove('selected'));

            // Reinicia e mostra as palavras
            palavras.forEach(palavra => {
                if (!palavrasEncontradas.has(palavra)) {
                    // Procura a palavra na grade
                    for (let i = 0; i < tamanho; i++) {
                        for (let j = 0; j < tamanho; j++) {
                            for (const dir of direcoes) {
                                if (podeColocarNaGradeAtual(palavra, i, j, dir)) {
                                    for (let k = 0; k < palavra.length; k++) {
                                        const r = i + dir.dx * k;
                                        const c = j + dir.dy * k;
                                        const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                                        if (cell) cell.classList.add('found');
                                    }
                                    palavrasEncontradas.add(palavra);
                                    document.getElementById('palavra-' + palavra).classList.add('found');
                                    return;
                                }
                            }
                        }
                    }
                }
            });
            verificarVitoria();
        }

        function podeColocarNaGradeAtual(palavra, linha, col, dir) {
            for (let i = 0; i < palavra.length; i++) {
                const r = linha + dir.dx * i;
                const c = col + dir.dy * i;
                if (r < 0 || r >= tamanho || c < 0 || c >= tamanho) return false;
                if (grade[r][c] !== palavra[i]) return false;
            }
            return true;
        }

        // Previne seleção de texto
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('mouseup', finalizarSelecao);

        // Inicia o jogo
        novoJogo();
    </script>
</body>
</html>
