<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.18) 0%, transparent 60%);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.4);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    h1 {
      text-align: center;
      font-size: 3.2em;
      margin: 0 0 10px 0;
      background: linear-gradient(90deg, #60a5fa, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome {
      text-align: center;
      color: #bae6fd;
      font-size: 1.4em;
      margin-bottom: 40px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .card {
      background: rgba(0,0,0,0.4);
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #60a5fa;
    }
    .card h3 {
      color: #60a5fa;
      margin-bottom: 15px;
    }
    .card .big-number {
      font-size: 2.8em;
      font-weight: bold;
      color: #93c5fd;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 1.3em;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 0;
    }
    button:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.7);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🅿️ ESTACIONAMENTO</h1>
    <p class="welcome">Bem-vindo ao Sistema de Gestão</p>

    <div class="dashboard">
      <div class="card">
        <h3>Vagas Totais</h3>
        <div class="big-number">30</div>
      </div>
      <div class="card">
        <h3>Vagas Ocupadas</h3>
        <div class="big-number" id="ocupadas">0</div>
      </div>
      <div class="card">
        <h3>Vagas Livres</h3>
        <div class="big-number" id="livres">30</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;">
      <button onclick="irParaCadastro()">📋 Cadastrar Novo Cliente</button>
      <button onclick="irParaEntrada()">🚗 Entrada na Garagem</button>
    </div>

    <h2 style="margin-top:40px;">🎟️ Últimos Tickets</h2>
    <div id="listaVeiculos"></div>
  </div>

  <script>
    let ocupadas = 0;

    function atualizarDashboard() {
      document.getElementById('ocupadas').textContent = ocupadas;
      document.getElementById('livres').textContent = 30 - ocupadas;
    }

    function irParaCadastro() {
      alert("📋 Redirecionando para Cadastro de Cliente...\n\n(Adicione aqui a aba de cadastro)");
    }

    function irParaEntrada() {
      alert("🚗 Redirecionando para Entrada na Garagem...\n\nPreencha os dados do veículo.");
    }

    // Exemplo de ticket inicial
    function adicionarTicketExemplo() {
      const div = document.createElement('div');
      div.innerHTML = `
        <div style="background:#fff;color:#000;padding:20px;border-radius:12px;margin:15px 0;border:3px dashed #1e40af;">
          <strong>Ticket Exemplo</strong><br>
          Vaga 05 • Placa ABC-1234<br>
          João Silva • Gol<br>
          Entrada: 08:45
        </div>`;
      document.getElementById('listaVeiculos').appendChild(div);
    }

    window.onload = () => {
      atualizarDashboard();
      adicionarTicketExemplo();
    };
  </script>
</body>
</html>
