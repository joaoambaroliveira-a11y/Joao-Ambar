<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: rgba(0,0,0,0.35); border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .tabs { display: flex; margin-bottom: 15px; }
    .tab { padding: 12px 20px; background: rgba(255,255,255,0.1); margin-right: 5px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; }
    .tab.active { background: #3b82f6; }
    .vagas-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; }
    .vaga { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 1.1em; font-weight: bold; border-radius: 10px; }
    .vaga-ocupada { background: #ef4444; color: white; }
    .status { text-align: center; font-size: 1.4em; margin: 15px 0; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; }
    .veiculo-card { background: rgba(255,255,255,0.12); padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 6px solid #3b82f6; }
    .log { max-height: 220px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-top: 15px; }
    .tempo { color: #fbbf24; font-weight: bold; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div style="background: rgba(15,23,42,0.95); position: fixed; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center;">
      <div style="background: rgba(255,255,255,0.1); padding: 40px; border-radius: 15px; width: 360px; text-align:center;">
        <h2>🔐 Acesso ao Sistema</h2>
        <input type="text" id="username" placeholder="Usuário" value="admin" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:rgba(255,255,255,0.2); color:white;"><br>
        <input type="password" id="password" placeholder="Senha" value="1234" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:rgba(255,255,255,0.2); color:white;"><br>
        <button onclick="fazerLogin()" style="width:100%; padding:14px;">Entrar</button>
      </div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ Estacionamento Simulator</h1>
      
      <div class="tabs">
        <div class="tab active" onclick="showTab(0)">📋 Clientes</div>
        <div class="tab" onclick="showTab(1)">🅿️ Estacionamento</div>
      </div>

      <!-- Conteúdo das abas (mesmo de antes, só adicionei melhorias) -->
      <!-- ... (mantive o resto igual para não ficar gigante) ... -->

      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    // ... (código anterior mantido) ...

    const valorPorHora = 12; // R$ 12,00 por hora

    function calcularTempo(entrada) {
      const agora = new Date();
      const [h, m] = entrada.split(':').map(Number);
      const entradaDate = new Date();
      entradaDate.setHours(h, m, 0);
      const diff = agora - entradaDate;
      const horas = (diff / 1000 / 60 / 60).toFixed(1);
      return parseFloat(horas);
    }

    function removerPorPlaca(placa) {
      const veiculo = veiculos[placa];
      if (!veiculo) return;

      veiculo.saida = formatarHora();
      const tempo = calcularTempo(veiculo.entrada);
      const valor = (tempo * valorPorHora).toFixed(2);

      delete veiculos[placa];
      delete vagaOcupada[veiculo.vaga];

      atualizarStatus();
      renderizarVagas();
      mostrarVeiculos();
      
      adicionarLog(`🚪 <strong>${veiculo.nome}</strong> saiu - ${tempo}h | Valor: R$ ${valor}`, "sucesso");
    }

    // Inicialização
    fazerLogin = () => { /* mesmo código */ };
  </script>
</body>
</html>
