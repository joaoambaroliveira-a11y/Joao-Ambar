<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #e0f2fe;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: rgba(15, 23, 42, 0.95);
      padding: 60px 50px;
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      border: 2px solid #60a5fa;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.5);
    }

    .logo {
      font-size: 6em;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.4em;
      margin: 0 0 10px 0;
      color: #bae6fd;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      border-radius: 12px;
      background: #1e2937;
      border: 2px solid #334155;
      color: white;
      font-size: 1.1em;
    }
    input:focus {
      border-color: #60a5fa;
      outline: none;
    }

    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.4em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
    }
    button:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.7);
    }

    .info {
      margin-top: 30px;
      color: #64748b;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo">🅿️</div>
    <h1>Estacionamento Simulator</h1>
    <p class="subtitle">Acesso ao Sistema</p>

    <input type="text" id="username" value="admin" placeholder="Nome de Usuário"><br>
    <input type="password" id="password" value="1234" placeholder="Senha"><br>

    <button onclick="fazerLogin()">ENTRAR NO SISTEMA</button>

    <div class="info">
      Usuário padrão: <strong>admin</strong><br>
      Senha padrão: <strong>1234</strong>
    </div>
  </div>

  <script>
    function fazerLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === "" || password === "") {
        alert("⚠️ Por favor, preencha usuário e senha!");
        return;
      }

      if (username.toLowerCase() === "admin" && password === "1234") {
        alert("✅ Login realizado com sucesso!\n\nBem-vindo ao Estacionamento Simulator");
        // Aqui você pode redirecionar para a página principal
        window.location.href = "#"; // Substitua pelo seu sistema completo
      } else {
        alert("❌ Usuário ou senha incorretos!\n\nTente:\nUsuário: admin\nSenha: 1234");
      }
    }

    // Permitir pressionar Enter
    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") fazerLogin();
    });
  </script>
</body>
</html>
