<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Corrida de Carro</title>
    <style>
        body { margin:0; padding:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#222; font-family:Arial, sans-serif; }
        canvas { border:4px solid #fff; background:#000; }
        #instructions { position:absolute; top:10px; color:white; text-align:center; width:100%; pointer-events:none; }
    </style>
</head>
<body>
    <div id="instructions">
        <h1>🏎️ Corrida de Carro 🏎️</h1>
        <p>Use as setas ← → para mover</p>
        <p>Evite os obstáculos • Colete as moedas douradas</p>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let carX = 180, carY = 480;
        let speed = 5, score = 0, gameOver = false, gameStarted = false;
        let roadY = 0, roadSpeed = 8;
        let obstacles = [], coins = [], frameCount = 0;
        let leftPressed = false, rightPressed = false;

        function drawCar() {
            ctx.fillStyle = '#ff0000'; ctx.fillRect(carX, carY, 40, 70);
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(carX+5, carY+10, 30, 25);
            ctx.fillStyle = '#333';
            ctx.fillRect(carX-5, carY+10, 10, 15); ctx.fillRect(carX+35, carY+10, 10, 15);
            ctx.fillRect(carX-5, carY+45, 10, 15); ctx.fillRect(carX+35, carY+45, 10, 15);
        }

        function drawRoad() {
            ctx.fillStyle = '#333'; ctx.fillRect(0,0,400,600);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 8;
            for (let i = -50; i < 650; i += 60) {
                let y = (roadY + i) % 660 - 50;
                ctx.beginPath(); ctx.moveTo(190, y); ctx.lineTo(190, y+40); ctx.stroke();
            }
            ctx.fillStyle = '#555';
            ctx.fillRect(0,0,80,600); ctx.fillRect(320,0,80,600);
        }

        function createObstacle() {
            const w = 40 + Math.random()*30;
            obstacles.push({x: 90 + Math.random()*(220-w), y: -60, width: w, height: 60});
        }

        function createCoin() {
            coins.push({x: 100 + Math.random()*200, y: -30, radius: 12});
        }

        function update() {
            if (!gameStarted || gameOver) return;
            frameCount++;
            roadY += roadSpeed;

            if (leftPressed && carX > 80) carX -= speed+2;
            if (rightPressed && carX < 280) carX += speed+2;

            if (frameCount % 45 === 0) createObstacle();
            if (frameCount % 35 === 0) createCoin();

            obstacles.forEach((o,i) => { o.y += roadSpeed; if (o.y > 600) obstacles.splice(i,1); });
            coins.forEach((c,i) => { c.y += roadSpeed; if (c.y > 600) coins.splice(i,1); });

            // Colisão obstáculos
            for (let o of obstacles) {
                if (!(carX > o.x + o.width || carX + 40 < o.x || carY > o.y + o.height || carY + 70 < o.y)) {
                    gameOver = true;
                }
            }

            // Coleta moedas
            for (let i = coins.length-1; i >= 0; i--) {
                let c = coins[i];
                let dx = carX + 20 - c.x;
                let dy = carY + 35 - c.y;
                if (Math.sqrt(dx*dx + dy*dy) < 35) {
                    coins.splice(i,1);
                    score += 10;
                }
            }

            if (frameCount % 600 === 0 && roadSpeed < 15) roadSpeed += 0.5;
        }

        function draw() {
            ctx.clearRect(0,0,400,600);
            drawRoad();
            obstacles.forEach(o => {
                ctx.fillStyle = '#ff8800'; ctx.fillRect(o.x, o.y, o.width, o.height);
                ctx.fillStyle = '#aa0000'; ctx.fillRect(o.x+5, o.y+10, o.width-10, 25);
            });
            ctx.fillStyle = '#ffd700';
            coins.forEach(c => {
                ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.fill();
            });
            drawCar();

            ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial';
            ctx.fillText('Pontos: ' + score, 20, 40);

            if (!gameStarted) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,400,600);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
                ctx.fillText('Pressione ESPAÇO', 200, 280);
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,400,600);
                ctx.fillStyle = '#ff0000'; ctx.font = 'bold 40px Arial'; ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', 200, 250);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Arial';
                ctx.fillText('Pontuação: ' + score, 200, 310);
                ctx.fillText('Pressione R para reiniciar', 200, 360);
            }
        }

        function gameLoop() {
            update(); draw();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') leftPressed = true;
            if (e.key === 'ArrowRight') rightPressed = true;
            if (e.key === ' ' && !gameStarted) gameStarted = true;
            if (e.key.toLowerCase() === 'r' && gameOver) {
                carX = 180; obstacles = []; coins = []; score = 0; gameOver = false; frameCount = 0; roadSpeed = 8;
            }
        });

        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') leftPressed = false;
            if (e.key === 'ArrowRight') rightPressed = false;
        });

        gameLoop();
    </script>
</body>
</html>
