<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0f2fe;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Tela de Login */
    #loginScreen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-box {
      background: rgba(15, 23, 42, 0.95);
      padding: 60px 50px;
      border-radius: 24px;
      width: 420px;
      text-align: center;
      border: 2px solid #60a5fa;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.6);
    }
    .login-box h1 {
      font-size: 4.5em;
      margin: 0 0 10px 0;
    }
    .login-box h2 {
      color: #bae6fd;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      background: #1e2937;
      color: white;
      border: 2px solid #60a5fa;
      font-size: 1.1em;
    }
    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.4em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    /* Sistema Principal */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.4);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>🅿️</h1>
      <h2>Estacionamento Simulator</h2>
      <p style="color:#94a3b8;margin-bottom:30px;">Acesso ao Sistema</p>
      
      <input type="text" id="username" value="admin" placeholder="Usuário"><br>
      <input type="password" id="password" value="1234" placeholder="Senha"><br>
      
      <button onclick="fazerLogin()">ENTRAR NO ESTACIONAMENTO</button>
    </div>
  </div>

  <!-- SISTEMA DO ESTACIONAMENTO -->
  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ ESTACIONAMENTO</h1>
      <p style="text-align:center;color:#60a5fa;">Bem-vindo ao sistema!</p>

      <!-- Aqui você pode colocar o resto do sistema (entrada de veículos, tickets, etc.) -->
      <div style="text-align:center; margin:50px 0; padding:40px; background:rgba(0,0,0,0.4); border-radius:15px;">
        <h2>Sistema carregado com sucesso!</h2>
        <p>Agora você pode continuar adicionando as funcionalidades de veículos e tickets.</p>
      </div>
    </div>
  </div>

  <script>
    function fazerLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === "admin" && password === "1234") {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('mainContent').style.display = "block";
      } else {
        alert("❌ Usuário ou senha incorretos!\n\nTente:\nUsuário: admin\nSenha: 1234");
      }
    }
  </script>
</body>
</html>
