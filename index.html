<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça-Palavras Neon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.4rem;
            color: #ffffff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 80px #0ff;
            letter-spacing: 2px;
        }

        .info {
            margin-bottom: 20px;
            font-size: 1.15rem;
            color: #e0e0e0;
            text-shadow: 0 0 8px #0ff;
        }

        .categorias {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .categoria-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #ff00aa;
            padding: 12px 22px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 0 8px #ff00aa;
            box-shadow: 0 0 10px rgba(255, 0, 170, 0.4);
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        .categoria-btn:hover {
            background: #ff00aa;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 15px #ff00aa, 0 0 30px #ff00aa;
            transform: translateY(-3px);
        }

        .categoria-btn.ativo {
            background: #0ff;
            color: #000;
            border-color: #0ff;
            text-shadow: none;
            box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 35px;
            justify-content: center;
            max-width: 1000px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(10, 42px);
            grid-template-rows: repeat(10, 42px);
            gap: 3px;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 14px;
            border: 2px solid #0ff;
            box-shadow: 
                0 0 10px #0ff,
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 15px rgba(0, 255, 255, 0.1);
            user-select: none;
        }

        .cell {
            width: 42px;
            height: 42px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #222;
            transition: all 0.15s ease;
            text-shadow: 0 0 6px #fff;
        }

        .cell:hover {
            background: #1a1a1a;
            border-color: #0ff;
            box-shadow: 0 0 8px #0ff;
            transform: scale(1.05);
        }

        .cell.selected {
            background: #0ff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            text-shadow: none;
            transform: scale(1.08);
        }

        .cell.found {
            background: #00ff9d;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px #00ff9d, 0 0 20px #00ff9d;
            text-shadow: none;
        }

        .words-panel {
            background: #0a0a0a;
            padding: 22px;
            border-radius: 14px;
            min-width: 230px;
            border: 2px solid #ff00aa;
            box-shadow: 0 0 10px #ff00aa, 0 0 20px rgba(255, 0, 170, 0.3);
        }

        .words-panel h2 {
            margin-bottom: 16px;
            font-size: 1.35rem;
            color: #fff;
            border-bottom: 2px solid #ff00aa;
            padding-bottom: 8px;
            text-shadow: 0 0 5px #fff, 0 0 15px #ff00aa;
        }

        #word-list {
            list-style: none;
        }

        #word-list li {
            padding: 9px 14px;
            margin-bottom: 7px;
            background: #111;
            border-radius: 7px;
            font-size: 1.1rem;
            color: #fff;
            border: 1px solid #333;
            transition: all 0.3s;
            text-shadow: 0 0 6px #fff;
        }

        #word-list li.found {
            background: #00ff9d;
            color: #000;
            text-decoration: line-through;
            border-color: #fff;
            box-shadow: 0 0 10px #00ff9d;
            text-shadow: none;
            opacity: 0.9;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid #0ff;
            padding: 13px 28px;
            font-size: 1.05rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 0 8px #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        button:hover {
            background: #0ff;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
            transform: translateY(-3px);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 25px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ff9d;
            text-shadow: 0 0 5px #00ff9d, 0 0 15px #00ff9d, 0 0 30px #00ff9d;
            min-height: 35px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <h1>🔍 CAÇA-PALAVRAS</h1>
    <div class="info">Escolha a categoria e encontre todas as palavras!</div>

    <div class="categorias">
        <button class="categoria-btn ativo" onclick="escolherCategoria('animais')">🐾 ANIMAIS</button>
        <button class="categoria-btn" onclick="escolherCategoria('objetos')">📦 OBJETOS</button>
        <button class="categoria-btn" onclick="escolherCategoria('pessoas')">👤 NOMES DE PESSOAS</button>
    </div>

    <div class="container">
        <div id="grid"></div>

        <div class="words-panel">
            <h2>PALAVRAS</h2>
            <ul id="word-list"></ul>
        </div>
    </div>

    <div class="controls">
        <button onclick="novoJogo()">NOVO JOGO</button>
        <button onclick="mostrarSolucao()">MOSTRAR SOLUÇÃO</button>
    </div>

    <div class="message" id="message"></div>

    <script>
        const tamanho = 10;

        const categorias = {
            animais: [
                "GATO", "CACHORRO", "PASSARO", "PEIXE", "COELHO",
                "LEAO", "TIGRE", "URSO", "RAPOSA", "CORUJA"
            ],
            objetos: [
                "MESA", "CADEIRA", "LIVRO", "CANETA", "RELOGIO",
                "CELULAR", "CHAVE", "OCULOS", "MOCHILA", "LAMPADA"
            ],
            pessoas: [
                "ANA", "JOAO", "MARIA", "PEDRO", "LUCAS",
                "JULIA", "CARLOS", "SOFIA", "MIGUEL", "BEATRIZ"
            ]
        };

        let palavras = [...categorias.animais];
        let categoriaAtual = 'animais';
        let grade = [];
        let palavrasEncontradas = new Set();
        let selecionando = false;
        let caminhoSelecionado = [];
        let direcaoAtual = null;

        const direcoes = [
            {dx: 0, dy: 1},
            {dx: 1, dy: 0},
            {dx: 1, dy: 1},
            {dx: 1, dy: -1},
            {dx: 0, dy: -1},
            {dx: -1, dy: 0},
            {dx: -1, dy: 1},
            {dx: -1, dy: -1}
        ];

        function escolherCategoria(cat) {
            categoriaAtual = cat;
            palavras = [...categorias[cat]];

            // Atualiza botões ativos
            document.querySelectorAll('.categoria-btn').forEach(btn => {
                btn.classList.remove('ativo');
            });
            event.target.classList.add('ativo');

            novoJogo();
        }

        function criarGradeVazia() {
            return Array.from({length: tamanho}, () => Array(tamanho).fill(''));
        }

        function podeColocar(palavra, linha, col, dir) {
            for (let i = 0; i < palavra.length; i++) {
                const r = linha + dir.dx * i;
                const c = col + dir.dy * i;
                if (r < 0 || r >= tamanho || c < 0 || c >= tamanho) return false;
                if (grade[r][c] !== '' && grade[r][c] !== palavra[i]) return false;
            }
            return true;
        }

        function colocarPalavra(palavra) {
            const tentativas = 100;
            for (let t = 0; t < tentativas; t++) {
                const dir = direcoes[Math.floor(Math.random() * direcoes.length)];
                const linha = Math.floor(Math.random() * tamanho);
                const col = Math.floor(Math.random() * tamanho);
                if (podeColocar(palavra, linha, col, dir)) {
                    for (let i = 0; i < palavra.length; i++) {
                        grade[linha + dir.dx * i][col + dir.dy * i] = palavra[i];
                    }
                    return true;
                }
            }
            return false;
        }

        function preencherLetrasAleatorias() {
            const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let i = 0; i < tamanho; i++) {
                for (let j = 0; j < tamanho; j++) {
                    if (grade[i][j] === '') {
                        grade[i][j] = letras[Math.floor(Math.random() * letras.length)];
                    }
                }
            }
        }

        function gerarGrade() {
            grade = criarGradeVazia();
            const palavrasEmbaralhadas = [...palavras].sort(() => Math.random() - 0.5);
            palavrasEmbaralhadas.forEach(p => colocarPalavra(p));
            preencherLetrasAleatorias();
        }

        function renderizarGrade() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let i = 0; i < tamanho; i++) {
                for (let j = 0; j < tamanho; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = grade[i][j];
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.addEventListener('mousedown', iniciarSelecao);
                    cell.addEventListener('mouseenter', continuarSelecao);
                    cell.addEventListener('mouseup', finalizarSelecao);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderizarListaPalavras() {
            const lista = document.getElementById('word-list');
            lista.innerHTML = '';
            palavras.forEach(p => {
                const li = document.createElement('li');
                li.textContent = p;
                li.id = 'palavra-' + p;
                if (palavrasEncontradas.has(p)) {
                    li.classList.add('found');
                }
                lista.appendChild(li);
            });
        }

        function iniciarSelecao(e) {
            selecionando = true;
            caminhoSelecionado = [];
            direcaoAtual = null;
            const cell = e.target;
            adicionarAoCaminho(cell);
            e.preventDefault();
        }

        function continuarSelecao(e) {
            if (!selecionando) return;
            const cell = e.target;
            if (!cell.classList.contains('cell')) return;

            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            if (caminhoSelecionado.length === 0) {
                adicionarAoCaminho(cell);
                return;
            }

            const ultimo = caminhoSelecionado[caminhoSelecionado.length - 1];
            const lastRow = parseInt(ultimo.dataset.row);
            const lastCol = parseInt(ultimo.dataset.col);

            if (caminhoSelecionado.some(c => c.dataset.row == row && c.dataset.col == col)) {
                if (caminhoSelecionado.length > 1) {
                    const penultimo = caminhoSelecionado[caminhoSelecionado.length - 2];
                    if (penultimo.dataset.row == row && penultimo.dataset.col == col) {
                        caminhoSelecionado.pop().classList.remove('selected');
                    }
                }
                return;
            }

            if (caminhoSelecionado.length === 1) {
                const dx = row - lastRow;
                const dy = col - lastCol;
                if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1 && (dx !== 0 || dy !== 0)) {
                    direcaoAtual = {dx, dy};
                    adicionarAoCaminho(cell);
                }
                return;
            }

            if (direcaoAtual) {
                const esperadoRow = lastRow + direcaoAtual.dx;
                const esperadoCol = lastCol + direcaoAtual.dy;
                if (row === esperadoRow && col === esperadoCol) {
                    adicionarAoCaminho(cell);
                }
            }
        }

        function adicionarAoCaminho(cell) {
            if (!caminhoSelecionado.includes(cell)) {
                caminhoSelecionado.push(cell);
                cell.classList.add('selected');
            }
        }

        function finalizarSelecao() {
            if (!selecionando) return;
            selecionando = false;

            const palavra = caminhoSelecionado.map(c => c.textContent).join('');
            const palavraInvertida = palavra.split('').reverse().join('');

            let encontrada = null;
            if (palavras.includes(palavra) && !palavrasEncontradas.has(palavra)) {
                encontrada = palavra;
            } else if (palavras.includes(palavraInvertida) && !palavrasEncontradas.has(palavraInvertida)) {
                encontrada = palavraInvertida;
            }

            if (encontrada) {
                palavrasEncontradas.add(encontrada);
                caminhoSelecionado.forEach(c => {
                    c.classList.remove('selected');
                    c.classList.add('found');
                });
                document.getElementById('palavra-' + encontrada).classList.add('found');
                verificarVitoria();
            } else {
                caminhoSelecionado.forEach(c => c.classList.remove('selected'));
            }

            caminhoSelecionado = [];
            direcaoAtual = null;
        }

        function verificarVitoria() {
            if (palavrasEncontradas.size === palavras.length) {
                document.getElementById('message').textContent = '🎉 PARABÉNS! VOCÊ ENCONTROU TODAS AS PALAVRAS!';
            }
        }

        function novoJogo() {
            palavrasEncontradas.clear();
            document.getElementById('message').textContent = '';
            gerarGrade();
            renderizarGrade();
            renderizarListaPalavras();
        }

        function mostrarSolucao() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(c => c.classList.remove('selected'));

            palavras.forEach(palavra => {
                if (!palavrasEncontradas.has(palavra)) {
                    for (let i = 0; i < tamanho; i++) {
                        for (let j = 0; j < tamanho; j++) {
                            for (const dir of direcoes) {
                                if (podeColocarNaGradeAtual(palavra, i, j, dir)) {
                                    for (let k = 0; k < palavra.length; k++) {
                                        const r = i + dir.dx * k;
                                        const c = j + dir.dy * k;
                                        const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                                        if (cell) cell.classList.add('found');
                                    }
                                    palavrasEncontradas.add(palavra);
                                    document.getElementById('palavra-' + palavra).classList.add('found');
                                    return;
                                }
                            }
                        }
                    }
                }
            });
            verificarVitoria();
        }

        function podeColocarNaGradeAtual(palavra, linha, col, dir) {
            for (let i = 0; i < palavra.length; i++) {
                const r = linha + dir.dx * i;
                const c = col + dir.dy * i;
                if (r < 0 || r >= tamanho || c < 0 || c >= tamanho) return false;
                if (grade[r][c] !== palavra[i]) return false;
            }
            return true;
        }

        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('mouseup', finalizarSelecao);

        // Inicia com Animais
        novoJogo();
    </script>
</body>
</html>
