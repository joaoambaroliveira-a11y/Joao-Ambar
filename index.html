<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Carro</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { background: #333; display: block; margin: auto; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let car = { x: 180, y: 500, width: 40, height: 80, color: "blue" };
    let obstacles = [];
    let gameOver = false;

    function drawCar() {
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.width, car.height);
    }

    function drawObstacles() {
      ctx.fillStyle = "red";
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.width, o.height));
    }

    function updateObstacles() {
      obstacles.forEach(o => o.y += 5);
      obstacles = obstacles.filter(o => o.y < canvas.height);
      if (Math.random() < 0.03) {
        obstacles.push({
          x: Math.random() * (canvas.width - 40),
          y: -80,
          width: 40,
          height: 80
        });
      }
    }

    function checkCollision() {
      obstacles.forEach(o => {
        if (car.x < o.x + o.width &&
            car.x + car.width > o.x &&
            car.y < o.y + o.height &&
            car.y + car.height > o.y) {
          gameOver = true;
        }
      });
    }

    function gameLoop() {
      if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over", 120, 300);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCar();
      drawObstacles();
      updateObstacles();
      checkCollision();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && car.x > 0) car.x -= 20;
      if (e.key === "ArrowRight" && car.x < canvas.width - car.width) car.x += 20;
    });

    gameLoop();
  </script>
</body>
</html>
