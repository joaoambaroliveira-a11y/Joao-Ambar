<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento - Controle de Veículos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .vaga { transition: all 0.3s; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h1 class="text-4xl font-bold text-center mb-2 text-gray-800">
        🅿️ Sistema de Estacionamento
      </h1>
      <p class="text-center text-gray-600 mb-8">Controle de Veículos - Geração de CPF/RG</p>

      <!-- Status -->
      <div class="grid grid-cols-3 gap-4 mb-8">
        <div class="bg-green-100 p-4 rounded-xl text-center">
          <p class="text-green-600 text-sm">Vagas Disponíveis</p>
          <p id="disponiveis" class="text-4xl font-bold text-green-700">25</p>
        </div>
        <div class="bg-blue-100 p-4 rounded-xl text-center">
          <p class="text-blue-600 text-sm">Vagas Ocupadas</p>
          <p id="ocupadas" class="text-4xl font-bold text-blue-700">0</p>
        </div>
        <div class="bg-gray-100 p-4 rounded-xl text-center">
          <p class="text-gray-600 text-sm">Total de Vagas</p>
          <p class="text-4xl font-bold text-gray-700">25</p>
        </div>
      </div>

      <!-- Menu -->
      <div class="flex justify-center gap-3 mb-8">
        <button onclick="mostrarTela(1)" class="tab-button active px-6 py-3 rounded-xl font-medium flex items-center gap-2 bg-blue-600 text-white">
          <i class="fas fa-car"></i> Entrada
        </button>
        <button onclick="mostrarTela(2)" class="tab-button px-6 py-3 rounded-xl font-medium flex items-center gap-2 hover:bg-gray-100">
          <i class="fas fa-sign-out-alt"></i> Saída
        </button>
        <button onclick="mostrarTela(3)" class="tab-button px-6 py-3 rounded-xl font-medium flex items-center gap-2 hover:bg-gray-100">
          <i class="fas fa-list"></i> Veículos
        </button>
      </div>

      <!-- Tela 1: Entrada -->
      <div id="tela1" class="tela">
        <div class="max-w-md mx-auto bg-gray-50 p-8 rounded-2xl">
          <h2 class="text-2xl font-semibold mb-6 text-center">Nova Entrada de Veículo</h2>
          
          <input type="text" id="placa" placeholder="Placa (ex: ABC1234)" maxlength="8"
            class="w-full p-4 border rounded-xl mb-4 text-center text-xl font-mono uppercase">
          
          <input type="text" id="nome" placeholder="Nome do Proprietário" 
            class="w-full p-4 border rounded-xl mb-6">

          <button onclick="entrarVeiculo()" 
            class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl text-lg font-semibold flex items-center justify-center gap-3">
            <i class="fas fa-check"></i> Registrar Entrada
          </button>
        </div>
      </div>

      <!-- Tela 2: Saída -->
      <div id="tela2" class="tela hidden">
        <div class="max-w-md mx-auto bg-gray-50 p-8 rounded-2xl">
          <h2 class="text-2xl font-semibold mb-6 text-center">Saída de Veículo</h2>
          <input type="text" id="placaSaida" placeholder="Digite a placa" maxlength="8"
            class="w-full p-4 border rounded-xl mb-6 text-center text-xl font-mono uppercase">
          <button onclick="sairVeiculo()" 
            class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-xl text-lg font-semibold">
            Liberar Veículo
          </button>
        </div>
      </div>

      <!-- Tela 3: Lista de Veículos -->
      <div id="tela3" class="tela hidden">
        <h2 class="text-2xl font-semibold mb-4">Veículos Estacionados</h2>
        <div id="listaVeiculos" class="space-y-3"></div>
      </div>

      <!-- Histórico -->
      <div class="mt-10">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
          <i class="fas fa-history"></i> Histórico de Saídas
        </h2>
        <div id="historico" class="text-sm bg-white border rounded-xl p-4 max-h-60 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script>
    let vagas = 25;
    let veiculos = {}; // placa -> dados
    let historico = [];

    function gerarCPF() {
      let cpf = Array.from({length: 9}, () => Math.floor(Math.random() * 10));
      let soma = cpf.reduce((acc, val, i) => acc + val * (10 - i), 0);
      let dv1 = (soma * 10 % 11) % 10;
      cpf.push(dv1);
      soma = cpf.reduce((acc, val, i) => acc + val * (11 - i), 0);
      let dv2 = (soma * 10 % 11) % 10;
      cpf.push(dv2);
      return cpf.join('');
    }

    function gerarRG() {
      return `${Math.floor(Math.random()*90)+10}.${Math.floor(Math.random()*900)+100}.${Math.floor(Math.random()*900)+100}-${Math.floor(Math.random()*10)}`;
    }

    function atualizarStatus() {
      document.getElementById('disponiveis').textContent = vagas - Object.keys(veiculos).length;
      document.getElementById('ocupadas').textContent = Object.keys(veiculos).length;
    }

    function mostrarTela(n) {
      document.querySelectorAll('.tela').forEach(t => t.classList.add('hidden'));
      document.getElementById(`tela${n}`).classList.remove('hidden');
      
      if (n === 3) listarVeiculos();
    }

    function entrarVeiculo() {
      const placa = document.getElementById('placa').value.trim().toUpperCase();
      const nome = document.getElementById('nome').value.trim();

      if (!placa || !nome) {
        alert("Preencha placa e nome!");
        return;
      }
      if (veiculos[placa]) {
        alert("Veículo já está estacionado!");
        return;
      }
      if (Object.keys(veiculos).length >= vagas) {
        alert("Estacionamento lotado!");
        return;
      }

      const cpf = gerarCPF();
      const rg = gerarRG();

      veiculos[placa] = {
        nome: nome,
        cpf: cpf,
        rg: rg,
        entrada: new Date().toLocaleTimeString('pt-BR')
      };

      alert(`✅ Veículo registrado!\n\nPlaca: ${placa}\nProprietário: ${nome}\nCPF: ${cpf}\nRG: ${rg}`);
      
      document.getElementById('placa').value = '';
      document.getElementById('nome').value = '';
      
      atualizarStatus();
      listarVeiculos();
    }

    function sairVeiculo() {
      const placa = document.getElementById('placaSaida').value.trim().toUpperCase();
      
      if (!placa) {
        alert("Digite a placa!");
        return;
      }
      if (!veiculos[placa]) {
        alert("Veículo não encontrado!");
        return;
      }

      const v = veiculos[placa];
      const saida = new Date().toLocaleTimeString('pt-BR');

      historico.unshift({
        placa: placa,
        nome: v.nome,
        entrada: v.entrada,
        saida: saida
      });

      delete veiculos[placa];

      alert(`🚗 Veículo ${placa} liberado!\nSaída: ${saida}`);

      document.getElementById('placaSaida').value = '';
      atualizarStatus();
      listarVeiculos();
      mostrarHistorico();
    }

    function listarVeiculos() {
      const container = document.getElementById('listaVeiculos');
      container.innerHTML = '';

      if (Object.keys(veiculos).length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-8">Nenhum veículo estacionado no momento.</p>';
        return;
      }

      for (let [placa, info] of Object.entries(veiculos)) {
        const div = document.createElement('div');
        div.className = "bg-white p-5 rounded-xl border hover:shadow-md";
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="font-mono text-2xl font-bold">${placa}</p>
              <p class="text-gray-700">${info.nome}</p>
              <p class="text-sm text-gray-500">Entrada: ${info.entrada}</p>
            </div>
            <div class="text-right">
              <p class="text-xs text-gray-500">CPF</p>
              <p class="font-mono">${info.cpf}</p>
            </div>
          </div>
        `;
        container.appendChild(div);
      }
    }

    function mostrarHistorico() {
      const container = document.getElementById('historico');
      container.innerHTML = '';

      if (historico.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center">Nenhum registro de saída ainda.</p>';
        return;
      }

      historico.forEach(item => {
        const div = document.createElement('div');
        div.className = "flex justify-between py-2 border-b last:border-0";
        div.innerHTML = `
          <div>
            <span class="font-mono">${item.placa}</span> - ${item.nome}
          </div>
          <div class="text-right text-xs text-gray-500">
            ${item.entrada} → ${item.saida}
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Inicializar
    atualizarStatus();
    mostrarTela(1);
  </script>
</body>
</html>
