<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Carro</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { background: #333; display: block; margin: auto; }

    /* Estilo do carro */
    .car {
      position: absolute;
      width: 60px;
      height: 100px;
      background: linear-gradient(to bottom, #1e90ff, #0000cd);
      border-radius: 10px;
      border: 2px solid #fff;
    }

    .car::before, .car::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: black;
      border-radius: 50%;
    }

    .car::before { bottom: -10px; left: 5px; }
    .car::after { bottom: -10px; right: 5px; }

    .windshield {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 40px;
      height: 20px;
      background: rgba(255,255,255,0.6);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="car" id="car">
    <div class="windshield"></div>
  </div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const carElement = document.getElementById("car");

    let car = { x: 180, y: 500, width: 60, height: 100 };
    let obstacles = [];
    let gameOver = false;

    function drawObstacles() {
      ctx.fillStyle = "red";
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.width, o.height));
    }

    function updateObstacles() {
      obstacles.forEach(o => o.y += 5);
      obstacles = obstacles.filter(o => o.y < canvas.height);
      if (Math.random() < 0.03) {
        obstacles.push({
          x: Math.random() * (canvas.width - 40),
          y: -80,
          width: 40,
          height: 80
        });
      }
    }

    function checkCollision() {
      obstacles.forEach(o => {
        if (car.x < o.x + o.width &&
            car.x + car.width > o.x &&
            car.y < o.y + o.height &&
            car.y + car.height > o.y) {
          gameOver = true;
        }
      });
    }

    function gameLoop() {
      if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over", 120, 300);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawObstacles();
      updateObstacles();
      checkCollision();

      // Atualiza posição do carro estilizado
      carElement.style.left = car.x + "px";
      carElement.style.top = car.y + "px";

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && car.x > 0) car.x -= 20;
      if (e.key === "ArrowRight" && car.x < canvas.width - car.width) car.x += 20;
    });

    gameLoop();
  </script>
</body>
</html>
